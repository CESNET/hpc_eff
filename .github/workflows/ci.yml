name: CI

on:
  push:
  pull_request:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential devscripts debhelper dh-python \
            python3-all python3-setuptools fakeroot

      - name: Build the package
        run: make deb

      - name: Move .deb into the workspace
        # dpkg-buildpackage writes to the parent directory, which is outside
        # the workspace and cannot be uploaded as an artifact from there
        run: mv ../hpc-eff_*.deb .

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: hpc-eff-deb
          path: hpc-eff_*.deb
          if-no-files-found: error
