[SYSTEM]
SCORENAME=SPEC2017
SCORE=3.8
POWERREADINGCMD=ipmitool dcmi power reading
DEBUG=yes

[API]
USER_AGENT=UserAgentString
API_KEY=XXX

[logging]
db_path=/var/lib/hpc_eff/history.db
log_level=INFO
state_json_path=/var/lib/hpc_eff/state.json
history_length=10

[frequency_tables]
# AMD EPYC
amd_epyc=2400,2000,1500

# Intel Xeon Gold 6130
intel_xeon_gold=3000,2900,2800,2700,2600,2200

# Intel E5-2650v3
intel_e5=3000,2800,2700,2600,2400,2300

# Fallback for unknown model
default=3000,2800,2700,2600,2400,2200

[TEMPERATURE]
# temperature threshold in degrees Celsius
THRESHOLD=80

[CPU_THERMO]
# Temperature thresholds (degrees Celsius)
MID_LIMIT=29
HIGH_LIMIT=32

# Target frequencies (string format, e.g. "3.10GHz")
HIGH_FREQUENCY=3.10GHz
MID_FREQUENCY=2.30GHz
LOW_FREQUENCY=1.50GHz

# IPMI sensor name used by ipmitool
SENSOR_NAME=INLET_AIR_TEMP

# Enable internal logging (1) and optional Slack webhook
ENABLE_LOG=1
#SLACK_URL=

[FEATURES]
# Enable or disable high-level actions. If disabled, related data
# (prices, CO2, power readings) will not be gathered to save work.
# Set to 'yes' or 'no'.
ENABLE_CPU_THERMO = yes
ENABLE_SET_CPU = no
